# AUTOGENERATED from hyprland.lua -- do not edit hyprland.conf directly.
############################
### MONITORS
############################
monitor=HDMI-A-1,2560x1440,0x0,auto
monitor=eDP-1,preferred,0x2160,auto
monitor=DP-3,3840x2160,0x0,auto

workspace=1,monitor:DP-3,persistent:true
workspace=2,monitor:DP-3,persistent:true
workspace=3,monitor:DP-3,persistent:true
workspace=4,monitor:DP-3,persistent:true
workspace=5,monitor:eDP-1,persistent:true
workspace=6,monitor:eDP-1,persistent:true
workspace=1,monitor:DP-1,persistent:true
workspace=2,monitor:DP-1,persistent:true

############################
### MY PROGRAMS
############################
$terminal = kitty
$menu = rofi -show drun

############################
### ENVIRONMENT VARIABLES
############################
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

############################
### LOOK AND FEEL
############################
general {
    gaps_in = 7
    gaps_out = 7,7,7,7
    border_size = 2
    col.active_border = rgb(fe8019) rgb(fabd2f) 45deg
    col.inactive_border = rgb(3c3836)
    resize_on_border = false
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 4
    active_opacity = 1.0
    inactive_opacity = 1.0
    dim_inactive = false
    dim_strength = 0.2
    blur {
        enabled = false
        size = 3
        passes = 1
        vibrancy = 0.1696
    }
    shadow {
        enabled = false
    }
}

animations {
    enabled = true

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

dwindle {
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 1
    disable_splash_rendering = true
    disable_hyprland_logo = true
}

############################
### INPUT
############################
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = true
    }
}

device {
    name = epic-mouse-v1
    sensitivity = -0.5
}

debug {
    enable_stdout_logs = true
}

############################
### KEYBINDINGS
############################
$mainMod = SUPER

bind = $mainMod, Q, killactive,
bind = $mainMod, P, exec, lua ~/.config/hypr/generate.lua > ~/.config/hypr/hyprland.conf && hyprctl reload
bind = $mainMod, E, exec, $terminal -e yazi
bind = $mainMod, F, fullscreen,
bind = $mainMod, space, exec, rofi -show drun
bind = $mainMod, Y, exec, youtube-music
bind = $mainMod ALT, L, exec, hyprlock
bind = $mainMod, M, fullscreen,
bind = $mainMod ALT, 4, exec, bash -c 'source ~/.sh_functions && screenshot_to_clipboard'
bind = $mainMod, B, exec, brave
bind = $mainMod, T, exec, kitty
bind = , XF86AudioRaiseVolume, exec, volumectl -u up
bind = , XF86AudioLowerVolume, exec, volumectl -u down
bind = , XF86AudioMute, exec, volumectl toggle-mute
bind = , XF86AudioMicMute, exec, volumectl -m toggle-mute

bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d
bind = $mainMod, Tab, cyclenext,
bind = $mainMod, Tab, bringactivetotop,
bind = $mainMod SHIFT, h, movewindow, l
bind = $mainMod SHIFT, l, movewindow, r
bind = $mainMod SHIFT, k, movewindow, u
bind = $mainMod SHIFT, j, movewindow, d

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10
bind = $mainMod SHIFT, LEFT, movecurrentworkspacetomonitor, +1
bind = $mainMod SHIFT, RIGHT, movecurrentworkspacetomonitor, -1

bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

############################
### WINDOWS AND WORKSPACES
############################
windowrule = opaque title:(YouTube Music)
windowrule = workspace 2 class:^(landing-brave)$
windowrule = suppress_event maximize class:.*

exec-once=bash ~/.config/hypr/startup.sh

gesture = 3, horizontal, workspace
